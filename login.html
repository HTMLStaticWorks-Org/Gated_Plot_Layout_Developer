<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Login | SOLTERRA Landmark Estates</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="antialiased min-h-screen relative flex items-center justify-center p-4 sm:p-6">
  <!-- Softly Blurred Property Background -->
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1920&q=80"
         alt="Luxury estate residence backdrop" class="w-full h-full object-cover scale-105 blur-[4px]" />
    <div class="absolute inset-0 bg-[#FAF8F5]/75 dark:bg-[#121210]/80 backdrop-blur-[2px]"></div>
  </div>

  <!-- Top Controls: RTL & Theme Toggle -->
  <div class="fixed top-4 left-4 right-4 flex items-center justify-end z-20 max-w-6xl mx-auto pointer-events-none">
    <div class="flex items-center gap-2.5 pointer-events-auto">
      <button type="button" data-dir-toggle onclick="window.SolterraDir.toggle()" class="w-10 h-10 rounded-full surface-elevated flex items-center justify-center hover:border-[var(--accent-gold)] transition-colors" aria-label="Switch to RTL layout" title="Toggle RTL / LTR">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8h16m0 0l-3.5-3.5M20 8l-3.5 3.5M20 16H4m0 0l3.5-3.5M4 16l3.5 3.5"/>
        </svg>
      </button>
      <button type="button" data-theme-toggle onclick="window.SolterraTheme.toggle()" class="w-10 h-10 rounded-full surface-elevated flex items-center justify-center hover:border-[var(--accent-gold)] transition-colors" aria-label="Toggle Theme">
        <svg data-theme-sun class="w-5 h-5 hidden text-gold" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/>
        </svg>
        <svg data-theme-moon class="w-5 h-5 text-olive" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Glassmorphism Login Card -->
  <main class="w-full max-w-md my-12 text-reveal">
    <div class="rounded-[2rem] p-7 sm:p-9 border border-theme shadow-2xl bg-white/80 dark:bg-[#1C1B18]/85 backdrop-blur-xl">
      <!-- Centered Logo & Brand Name -->
      <div class="flex flex-col items-center text-center mb-7">
        <a href="index.html" class="inline-flex items-center justify-center gap-3 group" aria-label="SOLTERRA Home">
          <svg class="w-10 h-10 shrink-0 transition-transform duration-500 group-hover:rotate-3" viewBox="0 0 64 64" fill="none">
            <rect x="3" y="3" width="58" height="58" rx="14" stroke="currentColor" stroke-opacity="0.2" stroke-width="2"/>
            <path d="M16 24V16H24M40 16H48V24M48 40V48H40M24 48H16V40" stroke="var(--accent-gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M32 18L44 25V39L32 46L20 39V25L32 18Z" stroke="var(--accent-olive)" stroke-width="2.3" stroke-linejoin="round"/>
            <path d="M32 18V32M32 32L44 25M32 32L20 25" stroke="var(--accent-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="32" cy="32" r="2.8" fill="var(--accent-gold)"/>
          </svg>
          <div class="flex flex-col items-start leading-none">
            <span class="font-serif-display text-2xl font-bold tracking-[0.18em] uppercase">SOLTERRA</span>
            <span class="text-[9px] tracking-[0.28em] uppercase text-gold font-semibold mt-0.5">Landmark Estates</span>
          </div>
        </a>
        <h1 class="font-serif-display text-3xl font-semibold mt-4">Welcome Back</h1>
        <p class="text-xs text-muted-custom mt-1">Sign in to access your plot documents &amp; site visit schedule</p>
      </div>

      <form id="login-form" class="space-y-4" novalidate>
        <div>
          <label for="login-email" class="block text-xs font-semibold uppercase tracking-wider mb-1.5">Email Address</label>
          <input id="login-email" name="email" type="email" required placeholder="you@example.com" class="luxury-input" />
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <input id="login-password" name="password" type="password" required placeholder="••••••••" class="luxury-input pr-11" />
            <button type="button" data-toggle-password="login-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-custom hover:text-gold p-1" aria-label="Show password">
              <svg data-eye-open class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg data-eye-closed class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs pt-1">
          <label class="inline-flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="rounded border-theme accent-[var(--accent-gold)]" />
            <span>Remember Me</span>
          </label>
          <button type="button" onclick="document.getElementById('login-feedback').className='mt-3 p-3 rounded-xl text-xs bg-amber-500/10 border border-[var(--accent-gold)]'; document.getElementById('login-feedback').textContent='Password reset requires a connected authentication backend.';" class="text-gold font-semibold hover:underline">
            Forgot Password?
          </button>
        </div>

        <button type="submit" class="btn-gold w-full mt-2">Login</button>
        <div id="login-feedback" class="hidden" role="status"></div>
      </form>

      <!-- Social Login: Icons ONLY, no text labels beside icons -->
      <div class="mt-6 pt-5 border-t border-theme text-center">
        <p class="text-[11px] uppercase tracking-[0.2em] text-muted-custom mb-4">Or continue with</p>
        <div class="flex items-center justify-center gap-4">
          <button type="button" onclick="alert('Google OAuth requires backend identity provider configuration.')" class="social-icon-btn social-google border-theme surface-primary" aria-label="Sign in with Google">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
              <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 10.9 0 13s.6 4 1.6 6l3.7-2.8z"/>
              <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.9C3.5 21.4 7.4 24 12 24z"/>
            </svg>
          </button>
          <button type="button" onclick="alert('Facebook OAuth requires backend identity provider configuration.')" class="social-icon-btn social-fb border-theme surface-primary" aria-label="Sign in with Facebook">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/>
            </svg>
          </button>
          <button type="button" onclick="alert('Apple Sign-In requires backend identity provider configuration.')" class="social-icon-btn social-apple border-theme surface-primary" aria-label="Sign in with Apple">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
            </svg>
          </button>
        </div>
      </div>

      <p class="text-center text-xs text-muted-custom mt-6">
        New to SOLTERRA? <a href="signup.html" class="text-gold font-semibold hover:underline">Create Account</a>
      </p>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.SolterraBindForm('login-form', 'login-feedback', 'login');
    });
  </script>
</body>
</html>
